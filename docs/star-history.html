<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Robotics Notebooks GitHub Star 数随时间变化的交互式趋势图。" />
  <title>Star 趋势 | Robotics Notebooks</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
  <meta name="color-scheme" content="dark light" />
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
</head>
<body>
  <main class="container" style="padding:3rem 0">
    <h1 class="hero-title" style="font-size:1.5rem">GitHub Star 趋势</h1>
    <p class="data-meta" id="star-status">正在从 GitHub API 拉取 stargazers…</p>
    <div id="star-chart" style="width:100%;height:460px"></div>
    <p><a href="https://github.com/ImChong/Robotics_Notebooks" target="_blank" rel="noopener noreferrer">⭐ 去 GitHub 点个 Star</a></p>
  </main>
  <script>
    (function () {
      var REPO = 'ImChong/Robotics_Notebooks';
      var status = document.getElementById('star-status');
      var headers = { Accept: 'application/vnd.github.star+json' };

      function getJSON(url, h) {
        return fetch(url, { headers: h || {} }).then(function (r) {
          if (!r.ok) throw new Error('GitHub API ' + r.status + (r.status === 403 ? '（可能触发未登录速率限制，稍后再试）' : ''));
          return r.json();
        });
      }

      getJSON('https://api.github.com/repos/' + REPO).then(function (repo) {
        var pages = Math.max(1, Math.ceil(repo.stargazers_count / 100));
        var reqs = [];
        for (var p = 1; p <= pages; p++) {
          reqs.push(getJSON('https://api.github.com/repos/' + REPO + '/stargazers?per_page=100&page=' + p, headers));
        }
        return Promise.all(reqs);
      }).then(function (chunks) {
        var dates = [].concat.apply([], chunks).map(function (s) { return s.starred_at; }).sort();
        var counts = dates.map(function (_, i) { return i + 1; });
        var css = getComputedStyle(document.documentElement);
        var text = css.getPropertyValue('--text').trim();
        var grid = css.getPropertyValue('--border').trim();
        var accent = css.getPropertyValue('--accent').trim();
        Plotly.newPlot('star-chart', [{
          x: dates, y: counts, type: 'scatter', mode: 'lines',
          line: { color: accent, width: 2 }, fill: 'tozeroy',
          hovertemplate: '%{x|%Y-%m-%d}<br>%{y} stars<extra></extra>'
        }], {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          font: { color: text }, margin: { t: 20, r: 20, b: 50, l: 50 },
          xaxis: { gridcolor: grid, rangeslider: { visible: true } },
          yaxis: { gridcolor: grid, title: 'Stars' }
        }, { responsive: true, displaylogo: false });
        status.textContent = '共 ' + dates.length + ' 个 Star，数据实时来自 GitHub API。';
      }).catch(function (e) {
        status.textContent = '加载失败：' + e.message;
      });
    })();
  </script>
</body>
</html>
