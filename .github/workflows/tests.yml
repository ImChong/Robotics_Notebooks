name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # generate_link_graph 的新增/维护标签需要完整 git 历史
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Detect PR change scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/ci_change_scope.py --base "origin/${{ github.base_ref }}" --output-file "$RUNNER_TEMP/ci-scope.json" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_change_scope.py --full --output-file "$RUNNER_TEMP/ci-scope.json" --github-output "$GITHUB_OUTPUT"
          fi

      - name: Install dev dependencies
        if: steps.scope.outputs.mode == 'full'
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        if: steps.scope.outputs.mode == 'full'
        run: ruff check scripts/ tests/

      - name: Ruff format (check)
        if: steps.scope.outputs.mode == 'full'
        run: ruff format --check scripts tests

      - name: Mypy
        if: steps.scope.outputs.mode == 'full'
        env:
          PYTHONPATH: scripts
        run: mypy scripts

      - name: pip-audit (requirements-dev)
        if: steps.scope.outputs.mode == 'full'
        run: python3 -m pip_audit -r requirements-dev.txt

      - name: Set up Node
        if: steps.scope.outputs.mode == 'full' || steps.scope.outputs.has_wiki == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: npm ci (ESLint)
        if: steps.scope.outputs.mode == 'full' || steps.scope.outputs.has_wiki == 'true'
        run: npm ci

      - name: ESLint docs/main.js
        if: steps.scope.outputs.mode == 'full'
        run: npm run lint:js

      - name: Validate all published Mermaid diagrams
        if: steps.scope.outputs.mode == 'full'
        run: npm run lint:mermaid

      - name: Validate Mermaid in changed wiki pages
        if: steps.scope.outputs.mode == 'ingest' && steps.scope.outputs.has_wiki == 'true'
        run: python3 scripts/ci_change_scope.py --validate-mermaid-from "$RUNNER_TEMP/ci-scope.json"

      - name: Run scope classification tests (ingest)
        if: steps.scope.outputs.mode == 'ingest'
        run: python3 -m unittest discover -s tests -p 'test_ci_change_scope.py'

      - name: Frontend reliability behavior tests
        if: steps.scope.outputs.mode == 'full'
        run: npm run test:frontend

      # 快照测试（test_community_naming / test_wiki_roadmaps_export）读取
      # exports/link-graph.json 与 exports/site-data-v1.json，二者不再入库，先生成
      - name: Generate export snapshots for tests
        if: steps.scope.outputs.mode == 'full'
        run: |
          python3 scripts/export_minimal.py
          python3 scripts/generate_link_graph.py

      - name: Pytest with coverage
        if: steps.scope.outputs.mode == 'full'
        env:
          PYTHONPATH: scripts
        run: python3 -m pytest --durations=20
