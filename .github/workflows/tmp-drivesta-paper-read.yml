name: Temporary DriveSTA original-paper text retrieval

on:
  push:
    branches:
      - ingest/drivesta-2611-27515-20261123

permissions:
  contents: read

jobs:
  paper-text:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Download official arXiv v1 PDF and convert to text
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 4 --max-time 210 --user-agent "Mozilla/5.0 robotics-notebooks-research/1.0" -o /tmp/drivesta.pdf https://arxiv.org/pdf/2611.27515v1
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          file /tmp/drivesta.pdf
          pdfinfo /tmp/drivesta.pdf | head -20
          pdftotext -layout /tmp/drivesta.pdf /tmp/drivesta.txt
          wc -lc /tmp/drivesta.txt
          echo "===== DRIVESTA PAPER FULL TEXT START ====="
          cat /tmp/drivesta.txt
          echo "===== DRIVESTA PAPER FULL TEXT END ====="
