name: Wiki Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # generate_link_graph 的新增/维护标签需要完整 git 历史
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-lite.txt

      - name: Install dependencies
        run: pip install -r requirements-ci-lite.txt

      # PR 不得修改 catalog.md / log.md / 部署生成的统计文件，否则与 main 的自动提交冲突。
      # 修复：make sync-main（见 scripts/pr_derived_guard.py）
      - name: Guard bot-owned / deploy-generated files
        if: github.event_name == 'pull_request'
        run: python3 scripts/pr_derived_guard.py check --base "origin/${{ github.base_ref }}"

      - name: Guard unique project nodes and new entity identities
        env:
          PROJECT_NODE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before || 'HEAD' }}
        run: |
          if [[ "$PROJECT_NODE_BASE" =~ ^0+$ ]]; then
            PROJECT_NODE_BASE=origin/main
          fi
          python3 scripts/check_project_nodes.py --base "$PROJECT_NODE_BASE"

      # graph-stats.json 不入库（部署时生成），lint 的孤儿节点检查需要先现场生成
      - name: Generate graph-stats before lint
        run: python3 scripts/generate_link_graph.py

      - name: Run wiki lint
        run: python3 scripts/lint_wiki.py --report
