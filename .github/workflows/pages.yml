name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # 最新提交优先：环境等待也会占住整条工作流，必须允许新运行取消旧运行。
  # false 只替换 pending 运行，无法释放卡在 waiting 的旧部署。
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 新增/维护徽章依赖 git 首次加入日；默认浅克隆会把几乎所有 wiki 标成 tip 日 Added
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-lite.txt

      - name: Install lightweight dependencies
        run: pip install -r requirements-ci-lite.txt

      # 站点大 JSON（search-index / index-v1 / site-data-v1 / link-graph /
      # hub-rankings）与 sitemap 不入库，部署时现场生成（等价 make export graph，约 40s）
      - name: Generate site data
        run: |
          python3 scripts/export_minimal.py
          python3 scripts/generate_link_graph.py
          python3 scripts/generate_home_stats.py
          python3 scripts/graph_exports_sync.py

      # 统计数字不入库（避免并行 PR 冲突），仅在构建产物里写入：
      # README 徽章 endpoint JSON、docs/index.html Hero 兜底数字、docs/sw.js 缓存版本
      - name: Stamp stats into site build
        run: python3 scripts/sync_all_stats.py --skip-graph --skip-home-stats

      - name: Copy README to docs
        run: cp README.md docs/README.md

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    # 限制 runner 启动后的部署耗时；启动前的环境等待由上面的并发策略解除。
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
