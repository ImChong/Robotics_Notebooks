  <meta property="og:title" content="增长趋势 | Robotics Notebooks" />

  <meta property="og:type" content="website" />

  <style>
    /* 七个视图在窄屏换行，并与副标题拉开距离 */
    #trend-tabs { flex-wrap: wrap; }
    #trend-section .home-hub-head { margin-bottom: 10px; }
    /* 底部按钮复用 change-log 的 .updates-timeline-actions；本页无时间线左轨道，去掉内缩 */
    #trend-section .updates-timeline-actions { padding-left: 0; padding-right: 0; }
    /* 纵深 / 公司节点数的社区配色图例：按宽度自动分列 */
    .trend-legend {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px;
      list-style: none; margin: 12px 0; padding: 0; font-size: .85rem; color: var(--text-muted);
    }
    .trend-legend[hidden] { display: none; }
    .trend-legend li { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .trend-legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
    /* 时间线跨度过长时的快捷范围按钮：一行置于图上方，提示文字跟在按钮后 */
    .trend-range { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 8px; }
    .trend-range[hidden] { display: none; }
    .trend-range-hint { color: var(--text-muted); font-size: .8rem; margin-left: 4px; }
    /* 时间线的公司 / 实验室名是 Plotly 文本链接；.main-svg 默认 pointer-events:none，需单独放开才能点击 */
    #trend-chart .main-svg a { pointer-events: all; cursor: pointer; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title" aria-label="机器人技术栈地图首页">🗺️ Robotics Notebooks | 机器人技术栈地图</a>
      <div class="header-spacer"></div>
      <div class="header-right">
        <a href="https://github.com/ImChong/Robotics_Notebooks" class="github-link" target="_blank" rel="noopener noreferrer">GitHub</a>
        <button id="themeToggle" class="theme-toggle" aria-label="切换白天黑夜模式" title="切换白天黑夜模式">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content">
    <section class="section" id="trend-section" aria-labelledby="trend-heading">
      <div class="container">
        <div class="home-hub-head">
          <h1 class="section-title" id="trend-heading">增长趋势</h1>
          <div class="home-hub-tabs" id="trend-tabs" role="group" aria-label="切换趋势视图"></div>
        </div>
        <p class="section-subtitle">星标数每日定时记录；节点与纵深路线按 git 首次加入日统计（仅含现存页面）；社区与纵深节点数取自当前知识图谱，公司 / 实验室节点数按各自技术路线收录统计；公司 / 实验室时间线按各节点注明的月份绘制。</p>
        <p class="data-meta" id="trend-status" aria-live="polite">加载中…</p>
        <ul class="trend-legend" id="trend-legend" aria-label="社区配色" hidden></ul>
        <div class="trend-range" id="trend-range" role="group" aria-label="时间范围" hidden></div>
        <div id="trend-chart" style="width:100%;min-height:460px"></div>
        <div class="updates-timeline-actions" role="group" aria-label="增长趋势导航">
          <div class="updates-timeline-actions-start">
            <a class="btn-secondary" href="change-log.html">查看更新记录</a>
            <a class="btn-secondary" href="https://github.com/ImChong/Robotics_Notebooks" target="_blank" rel="noopener noreferrer">⭐ 去 GitHub 点个 Star</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <a href="https://imchong.github.io/index.html" target="_blank" rel="noopener noreferrer">Chong Liu</a> 2026 · Robotics Notebooks</p>
    </div>
  </footer>

  <script>
    (function () {
      var tabs = document.getElementById('trend-tabs');
      var status = document.getElementById('trend-status');
      var legend = document.getElementById('trend-legend');
      var rangeBar = document.getElementById('trend-range');

      function getJSON(url) {
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error(r.status + ' ' + url);
          return r.json();
        });
      }

      // 按日计数 → 累计序列
      function cumulative(daily) {
        var total = 0;
        return { x: daily.x, y: daily.y.map(function (n) { return (total += n); }) };
      }
      function dailyFromDates(dates) {
        var byDay = {};
        dates.forEach(function (d) { byDay[d] = (byDay[d] || 0) + 1; });
        var x = Object.keys(byDay).sort();
        return { x: x, y: x.map(function (d) { return byDay[d]; }) };
      }

      // 每日定时任务记录的星标总数快照 [[日期, 总数], ...]
      var starCounts = getJSON('exports/star-history.json').then(function (d) {
        return { x: d.counts.map(function (c) { return c[0]; }), y: d.counts.map(function (c) { return c[1]; }) };
      });

      // link-graph / wiki-activity 是紧凑格式，用 main.js 的共享还原逻辑展开（见 expandLinkGraph / expandWikiActivity）
      function expandExport(kind, data) {
        var formats = window.RNExportFormats;
        return formats && typeof formats[kind] === 'function' ? formats[kind](data) : data;
      }

      var addedNodes = getJSON('exports/wiki-activity.json').then(function (a) {
        a = expandExport('expandWikiActivity', a);
        var out = [];
        a.days.forEach(function (d) {
          d.nodes.forEach(function (n) {
            if (n.action === 'added') out.push({ date: d.date, path: n.path || '' });
          });
        });
        return out;
      });

      // 社区 / 纵深 / 公司节点数：取当前知识图谱快照（仅在切到对应视图时加载）
      var linkGraphPromise = null;
      function linkGraph() {
        return linkGraphPromise || (linkGraphPromise = getJSON('exports/link-graph.json').then(function (g) {
          return expandExport('expandLinkGraph', g);
        }));
      }
      var companyRoadmapsPromise = null;
      function companyRoadmaps() {
        return companyRoadmapsPromise || (companyRoadmapsPromise = getJSON('company-roadmaps.json'));
      }
      var labRoadmapsPromise = null;
      function labRoadmaps() {
        return labRoadmapsPromise || (labRoadmapsPromise = getJSON('lab-roadmaps.json'));
      }

      // 时间线的两类机构：点击跳回各自路线页；配色为分类色板第 1 / 2 槽（蓝 / 橙），
      // 已按站点浅色 #ffffff、深色 #191919 底色校验色觉区分与对比度
      var ORG_KINDS = {
        company: { label: '公司', unit: '家', page: 'company.html', symbol: 'circle', glyph: '●',
          color: { light: '#2a78d6', dark: '#3987e5' } },
        lab: { label: '实验室', unit: '个', page: 'lab.html', symbol: 'diamond', glyph: '◆',
          color: { light: '#eb6834', dark: '#d95926' } }
      };

      // 每个机构一行；同月节点合并为一个点，未注明日期的节点只计数不绘制
      function ganttRows(orgs, kind) {
        return (orgs || []).map(function (org) {
          var byDate = {};
          var undated = 0;
          (org.nodes || []).forEach(function (n) {
            if (!n.date) { undated += 1; return; }
            (byDate[n.date] || (byDate[n.date] = [])).push(n.title + '（' + n.track + '）');
          });
          return {
            key: org.key,
            name: org.name,
            kind: kind,
            year: org.founded_year,
            href: ORG_KINDS[kind].page + '?id=' + encodeURIComponent(org.key),
            undated: undated,
            points: Object.keys(byDate).sort().map(function (d) { return { date: d, items: byDate[d] }; })
          };
        });
      }
      function ganttData(allRows) {
        var dated = 0;
        var undated = 0;
        var orgCount = {};
        allRows.forEach(function (r) {
          undated += r.undated;
          r.points.forEach(function (p) { dated += p.items.length; });
        });
        var rows = allRows.filter(function (r) { return r.points.length; });
        rows.forEach(function (r) { orgCount[r.kind] = (orgCount[r.kind] || 0) + 1; });
        var dates = rows.map(function (r) { return r.points[0].date; })
          .concat(rows.map(function (r) { return r.points[r.points.length - 1].date; })).sort();
        var orgs = Object.keys(ORG_KINDS).filter(function (k) { return orgCount[k]; }).map(function (k) {
          return orgCount[k] + ' ' + ORG_KINDS[k].unit + ORG_KINDS[k].label;
        });
        return {
          rows: rows,
          first: dates[0],
          last: dates[dates.length - 1],
          total: orgs.join('、') + '，' + dated + ' 个已注明日期的节点'
            + (dates.length ? '（' + dates[0] + ' → ' + dates[dates.length - 1] + '）' : '')
            + (undated ? '；另有 ' + undated + ' 个未注明日期的节点未绘制' : '')
        };
      }

      function depthDaily() {
        return addedNodes.then(function (n) {
          return dailyFromDates(n.filter(function (v) { return /^roadmap\/depth-/.test(v.path); })
            .map(function (v) { return v.date; }));
        });
      }

      var VIEWS = [
        { id: 'stars', label: '星数趋势', unit: '星标', kind: 'line',
          load: function () { return starCounts; } },
        { id: 'stars-daily', label: '每日星数', unit: '新增星标', kind: 'bar',
          load: function () {
            // 相邻快照之差；有取消星标时可能为负
            return starCounts.then(function (s) {
              return { x: s.x, y: s.y.map(function (n, i) { return n - (i ? s.y[i - 1] : 0); }) };
            });
          } },
        { id: 'nodes', label: '节点数趋势', unit: '节点', kind: 'line',
          load: function () { return addedNodes.then(function (n) { return cumulative(dailyFromDates(n.map(function (v) { return v.date; }))); }); } },
        { id: 'nodes-daily', label: '每日节点数', unit: '新增节点', kind: 'bar',
          load: function () { return addedNodes.then(function (n) { return dailyFromDates(n.map(function (v) { return v.date; })); }); } },
        { id: 'depth', label: '纵深数趋势', unit: '纵深路线', kind: 'line', hidden: true,
          load: function () { return depthDaily().then(cumulative); } },
        { id: 'depth-daily', label: '每日纵深数', unit: '新增纵深路线', kind: 'bar', hidden: true,
          load: depthDaily },
        { id: 'communities', label: '社区节点数', unit: '节点', kind: 'category',
          load: function () {
            return linkGraph().then(function (g) {
              var list = RNGraphTooltip.getSortedCommunities(g.communities)
                .filter(function (c) { return c.size > 0; });
              var color = RNGraphTooltip.buildCommunityColorMap(g.communities);
              return {
                // 与纵深节点数一致：显示「中文（English）」，仅去掉末尾「社区」
                cats: list.map(function (c) { return String(c.label || c.id).replace(/\s*社区\s*$/, ''); }),
                // 点击跳到互链榜单页的对应社区榜单
                links: list.map(function (c) { return 'hubs.html?community=' + encodeURIComponent(c.id); }),
                series: [{
                  values: list.map(function (c) { return c.size; }),
                  color: list.map(function (c) { return color[c.id]; })
                }],
                total: list.length + ' 个社区，合计 ' + list.reduce(function (a, c) { return a + c.size; }, 0) + ' 节点'
              };
            });
          } },
        { id: 'depth-nodes', label: '纵深节点数', unit: '节点', kind: 'category',
          load: function () {
            // 纵深命中口径与 graph.html 路线视图一致；条形按节点主社区堆叠着色
            return linkGraph().then(function (g) {
              var D = RNDepthFilters;
              var count = {};
              g.nodes.forEach(function (n) {
                D.depthsForNode(n).forEach(function (k) {
                  var byDepth = count[n.community] || (count[n.community] = {});
                  byDepth[k] = (byDepth[k] || 0) + 1;
                });
              });
              var color = RNGraphTooltip.buildCommunityColorMap(g.communities);
              var sum = 0;
              var series = RNGraphTooltip.getSortedCommunities(g.communities)
                .filter(function (c) { return count[c.id]; })
                .map(function (c) {
                  var values = D.DEPTH_ORDER.map(function (k) { return count[c.id][k] || 0; });
                  values.forEach(function (v) { sum += v; });
                  return { name: RNGraphTooltip.shortenCommunityLabel(c.label), values: values, color: color[c.id] };
                });
              return {
                cats: D.DEPTH_ORDER.map(function (k) { return D.DEPTH_META[k].label; }),
                // 点击跳到该纵深的路线页：roadmap/depth-x.md → roadmap.html?id=roadmap-depth-x
                links: D.DEPTH_ORDER.map(function (k) {
                  return 'roadmap.html?id=roadmap-' + D.depthHubPath(k).replace(/^roadmap\//, '').replace(/\.md$/, '');
                }),
                series: series,
                total: D.DEPTH_ORDER.length + ' 条纵深，合计 ' + sum + ' 节点次（一个节点可属多条纵深）'
              };
            });
          } }
      ];
      // 公司 / 实验室节点数：顺序与首页一致；同一机构内按知识节点 ID 去重，跨机构分别计数。
      // 条形按节点主社区堆叠着色，点击条形或名称跳到该机构的路线页
      function orgNodeCounts(g, orgs) {
        var nodes = new Map(g.nodes.map(function (n) { return [n.detail_id, n]; }));
        var count = {};
        var sum = 0;
        orgs.forEach(function (org, i) {
          var seen = new Set();
          (org.nodes || []).forEach(function (entry) {
            var n = nodes.get(entry.id);
            if (!n || seen.has(n.id)) return;
            seen.add(n.id);
            var values = count[n.community] || (count[n.community] = orgs.map(function () { return 0; }));
            values[i] += 1;
            sum += 1;
          });
        });
        var color = RNGraphTooltip.buildCommunityColorMap(g.communities);
        return {
          cats: orgs.map(function (org) { return org.name; }),
          links: orgs.map(function (org) { return ORG_KINDS[org.kind].page + '?id=' + encodeURIComponent(org.key); }),
          kinds: orgs.map(function (org) { return org.kind; }),
          series: RNGraphTooltip.getSortedCommunities(g.communities)
            .filter(function (c) { return count[c.id]; })
            .map(function (c) {
              return { name: RNGraphTooltip.shortenCommunityLabel(c.label), values: count[c.id], color: color[c.id] };
            }),
          sum: sum
        };
      }
      function withKind(orgs, kind) {
        return (orgs || []).map(function (org) { return Object.assign({ kind: kind }, org); });
      }
      VIEWS.push({ id: 'company-nodes', label: '公司节点数', unit: '节点', kind: 'category',
        load: function () {
          return Promise.all([linkGraph(), companyRoadmaps()]).then(function (data) {
            var s = orgNodeCounts(data[0], withKind(data[1].companies, 'company'));
            s.total = s.cats.length + ' 家公司，合计 ' + s.sum + ' 节点次（公司内去重，一个节点可属多家公司）';
            return s;
          });
        } });
      VIEWS.push({ id: 'lab-nodes', label: '实验室节点数', unit: '节点', kind: 'category',
        load: function () {
          return Promise.all([linkGraph(), labRoadmaps()]).then(function (data) {
            var s = orgNodeCounts(data[0], withKind(data[1].labs, 'lab'));
            s.total = s.cats.length + ' 个实验室，合计 ' + s.sum + ' 节点次（实验室内去重，一个节点可属多个实验室）';
            return s;
          });
        } });
      // 公司与实验室合并：与合并时间线同序（按成立年份交错，同年公司在前），名称前用 ● / ◆ 区分两类机构
      VIEWS.push({ id: 'org-nodes', label: '公司 + 实验室节点数', unit: '节点', kind: 'category',
        load: function () {
          return Promise.all([linkGraph(), companyRoadmaps(), labRoadmaps()]).then(function (data) {
            var orgs = withKind(data[1].companies, 'company').concat(withKind(data[2].labs, 'lab'));
            orgs.sort(function (a, b) { return a.founded_year - b.founded_year; });
            var s = orgNodeCounts(data[0], orgs);
            var companies = s.kinds.filter(function (k) { return k === 'company'; }).length;
            s.marked = true;
            s.total = companies + ' 家公司、' + (orgs.length - companies) + ' 个实验室，合计 ' + s.sum +
              ' 节点次（机构内去重，一个节点可属多个机构；名称前 ● 为公司、◆ 为实验室）';
            return s;
          });
        } });
      // 路线甘特图：每个机构一行（顺序同首页，按成立年份），同月节点合并为一个点
      VIEWS.push({ id: 'company-timeline', label: '公司时间线', unit: '节点', kind: 'gantt',
        load: function () {
          return companyRoadmaps().then(function (data) {
            return ganttData(ganttRows(data.companies, 'company'));
          });
        } });
      VIEWS.push({ id: 'lab-timeline', label: '实验室时间线', unit: '节点', kind: 'gantt',
        load: function () {
          return labRoadmaps().then(function (data) {
            return ganttData(ganttRows(data.labs, 'lab'));
          });
        } });
      // 公司与实验室合并：按成立年份交错排列（同年公司在前），用颜色和点形区分两类机构
      VIEWS.push({ id: 'org-timeline', label: '公司 + 实验室时间线', unit: '节点', kind: 'gantt',
        load: function () {
          return Promise.all([companyRoadmaps(), labRoadmaps()]).then(function (data) {
            var rows = ganttRows(data[0].companies, 'company').concat(ganttRows(data[1].labs, 'lab'));
            rows.sort(function (a, b) { return a.year - b.year; });
            return ganttData(rows);
          });
        } });
      // 暂时隐藏的视图（纵深数趋势 / 每日纵深数）
      VIEWS = VIEWS.filter(function (v) { return !v.hidden; });

      var touch = window.matchMedia('(pointer: coarse)').matches;
      var narrowMq = window.matchMedia('(max-width: 640px)');
      var current = null;
      // Plotly 调用串行化：上一次 react 未完成时再 react 会留下错乱的内部状态
      //（范围滑条被撑到 2000-01-01），拖动滑条后坐标轴随之跑偏
      var drawing = Promise.resolve();
      function render(view) {
        current = view;
        Array.prototype.forEach.call(tabs.children, function (b) {
          var active = b.dataset.view === view.id;
          b.className = 'home-hub-tab' + (active ? ' is-active' : '');
          b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        status.textContent = '加载中…';
        view.load().then(function (s) {
          var job = drawing.then(function () { return draw(view, s); });
          drawing = job.catch(function () {});
          return job;
        }).catch(function (e) {
          if (current !== view) return;
          status.textContent = '加载失败：' + e.message;
          if (window.Plotly) Plotly.purge('trend-chart');
        });
        history.replaceState(null, '', '?view=' + view.id);
      }

      function draw(view, s) {
        if (current !== view) return;
        var css = getComputedStyle(document.documentElement);
        var text = css.getPropertyValue('--text').trim();
        var muted = css.getPropertyValue('--text-muted').trim();
        var grid = css.getPropertyValue('--border').trim();
        var accent = css.getPropertyValue('--accent').trim();
        rangeBar.hidden = true;
        ganttRange = null;
        // 甘特图与条形图高度按行数计算；行少时（如实验室时间线 / 节点数）不再被 460px 最小高度撑出空白
        document.getElementById('trend-chart').style.minHeight = view.kind === 'gantt' || view.kind === 'category' ? '0' : '460px';
        if (view.kind === 'category') return drawCategory(view, s, text, muted, grid);
        if (view.kind === 'gantt') return drawGantt(view, s, text, muted, grid, css.getPropertyValue('--bg').trim());
        legend.hidden = true;
        var trace = view.kind === 'bar'
          ? { type: 'bar', marker: { color: accent }, width: 0.8 * 86400000 } // 日期不连续时固定为 0.8 天宽
          : { type: 'scatter', mode: 'lines', line: { color: accent, width: 2, shape: 'hv' } };
        trace.x = s.x;
        trace.y = s.y;
        trace.hovertemplate = '%{x|%Y-%m-%d}<br>%{y} ' + view.unit + '<extra></extra>';
        var plotted = Plotly.react('trend-chart', [trace], {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          // 显式高度：分类视图更高，切回时 react 不会按容器重算高度
          font: { color: text }, height: 460, margin: { t: 20, r: 20, b: 50, l: 60 },
          xaxis: {
            gridcolor: grid, type: 'date', rangeslider: { visible: true },
            // 数字日期格式，避免 Plotly 默认的英文月份（May 2026）
            tickformatstops: [
              { dtickrange: [null, 86400000 - 1], value: '%m-%d %H:%M' },
              { dtickrange: [86400000, 14 * 86400000], value: '%m-%d' },
              { dtickrange: [14 * 86400000 + 1, null], value: '%Y-%m' }
            ]
          },
          yaxis: { gridcolor: grid, title: view.unit, rangemode: 'tozero' },
          bargap: 0.2,
          modebar: { bgcolor: 'rgba(0,0,0,0)', color: muted, activecolor: text },
          // 触屏上拖拽框选会吞掉页面滚动；缩放交给下方范围滑条
          dragmode: touch ? false : 'zoom'
        }, { responsive: true, displaylogo: false, displayModeBar: !touch });
        var total = view.kind === 'bar'
          ? s.y.reduce(function (a, b) { return a + b; }, 0)
          : (s.y[s.y.length - 1] || 0);
        status.textContent = view.label + '：' + (view.kind === 'bar' ? '合计 ' : '当前 ') + total + ' ' + view.unit
          + (s.x.length ? '（' + s.x[0] + ' → ' + s.x[s.x.length - 1] + '）' : '');
        return plotted;
      }

      // 社区名 / 纵深名 / 公司名做横向条形图：长标签放纵轴水平排布，不再斜排挤占图面；
      // 保持数据给出的顺序，首项在上，条末标数值；多个 series 时按社区堆叠并显示图例
      function drawCategory(view, s, text, muted, grid) {
        var narrow = narrowMq.matches;
        var totals = s.cats.map(function (_, i) {
          return s.series.reduce(function (a, t) { return a + t.values[i]; }, 0);
        });
        // 窄屏只显示中文名，完整「中文（English）」留给悬停提示
        var labels = s.cats.map(function (c) {
          return narrow ? RNGraphTooltip.shortenCommunityLabel(c) : c;
        });
        var stacked = s.series.length > 1;
        var traces = s.series.map(function (t) {
          return {
            type: 'bar', orientation: 'h', name: t.name,
            y: labels, x: t.values, customdata: s.cats, marker: { color: t.color },
            hovertemplate: '%{customdata}<br>' + (t.name ? t.name + '：' : '') + '%{x} ' + view.unit +
              (touch && s.links ? '<br><i>再点一次该条形跳转 →</i>' : '') + '<extra></extra>'
          };
        });
        // 社区配色图例用 HTML 网格：Plotly 图例在长纵轴标签旁换行不可控
        legend.innerHTML = stacked ? s.series.map(function (t) {
          return '<li><i style="background:' + t.color + '"></i>' + t.name + '</li>';
        }).join('') : '';
        legend.hidden = !stacked;
        // 有链接时名称做成文本链接；合并视图名称前加类别标记（● 公司 / ◆ 实验室，标记着色、名称保持链接色）
        var theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var ticktext = s.links ? labels.map(function (l, i) {
          var k = s.marked && ORG_KINDS[s.kinds[i]];
          return (k ? '<span style="color:' + k.color[theme] + '">' + k.glyph + '</span> ' : '') +
            '<a href="' + s.links[i] + '" target="_self">' + l + '</a>';
        }) : undefined;
        var height = labels.length * (narrow ? 26 : 24) + 50;
        var max = Math.max.apply(null, [1].concat(totals));
        var plotted = Plotly.react('trend-chart', traces, {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          font: { color: text, size: narrow ? 11 : 12 }, height: height,
          margin: { t: 10, r: 12, b: 30, l: 10 },
          xaxis: { gridcolor: grid, rangemode: 'tozero', range: [0, max * 1.12], fixedrange: true },
          yaxis: { type: 'category', autorange: 'reversed', automargin: true, ticksuffix: ' ', fixedrange: true,
            tickvals: ticktext && labels, ticktext: ticktext },
          annotations: totals.map(function (v, i) {
            return { x: v, y: labels[i], text: String(v), xanchor: 'left', xshift: 4,
              showarrow: false, font: { color: muted, size: narrow ? 10 : 11 } };
          }),
          barmode: 'stack', bargap: 0.25, showlegend: false,
          modebar: { bgcolor: 'rgba(0,0,0,0)', color: muted, activecolor: text },
          dragmode: false
        }, { responsive: true, displaylogo: false, displayModeBar: false });
        status.textContent = view.label + '：' + s.total;
        return plotted.then(function (gd) {
          bindChartLinks(gd, view, s.links ? function (pt) { return s.links[pt.pointIndex]; } : null);
          return gd;
        });
      }

      // 'YYYY-MM' 前后平移若干月，给时间轴两端留白
      function shiftMonth(ym, k) {
        return new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + k, 1)).toISOString().slice(0, 7);
      }
      function monthsBetween(a, b) {
        return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
      }

      // 甘特图时间窗：每月宽度低于该值时节点（直径 9–15px）会互相压住，改为默认只看近几年，
      // 底部范围滑条左右平移 / 拖两端缩放，上方快捷按钮切换范围（触屏不开拖拽，靠滑条与按钮）
      var GANTT_MIN_PX_PER_MONTH = 8;
      var GANTT_WINDOWS = [
        { years: 2, label: '近 2 年' }, { years: 3, label: '近 3 年' },
        { years: 5, label: '近 5 年' }, { years: 0, label: '全部' }
      ];
      var ganttYears = 3;
      var ganttRange = null; // 当前甘特图的 年数 → 范围 映射；非时间窗视图为 null
      var applyingRange = false;
      function markRange(years) {
        Array.prototype.forEach.call(rangeBar.querySelectorAll('button'), function (b) {
          var on = years !== null && +b.getAttribute('data-years') === years;
          b.className = 'home-hub-tab' + (on ? ' is-active' : '');
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
      }
      rangeBar.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-years]');
        if (!b || !ganttRange) return;
        ganttYears = +b.getAttribute('data-years');
        markRange(ganttYears);
        var range = ganttRange(ganttYears);
        var job = drawing.then(function () {
          applyingRange = true;
          return Plotly.relayout('trend-chart', { 'xaxis.range': range });
        }).then(function () { applyingRange = false; }, function () { applyingRange = false; });
        drawing = job;
      });

      // 路线甘特图：横线连起首末节点，点为当月节点（同月多个则放大，悬停列出标题与方向）。
      // 窄屏隐藏纵轴标签，把机构名放到各自横线上方，让时间轴占满整宽；
      // 点击节点或机构名跳到对应的路线页 company.html?id=<key> / lab.html?id=<key>
      function orgLink(r) {
        return '<a href="' + r.href + '" target="_self">' + r.name + '</a>';
      }
      function drawGantt(view, s, text, muted, grid, bg) {
        var narrow = narrowMq.matches;
        var theme = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var names = s.rows.map(function (r) { return r.name; });
        var kinds = Object.keys(ORG_KINDS).filter(function (k) {
          return s.rows.some(function (r) { return r.kind === k; });
        });
        var mixed = kinds.length > 1;
        // 横线按机构类别各一条 trace（单条 trace 只能有一种线色）
        var spans = kinds.map(function (k) {
          return { type: 'scatter', mode: 'lines', x: [], y: [], hoverinfo: 'skip', opacity: 0.35,
            line: { color: ORG_KINDS[k].color[theme], width: narrow ? 4 : 6 } };
        });
        var dots = { type: 'scatter', mode: 'markers', x: [], y: [], text: [], customdata: [],
          marker: { color: [], symbol: [], size: [], line: { color: bg, width: 1 } },
          hovertemplate: '%{text}<extra></extra>' };
        s.rows.forEach(function (r) {
          var p = r.points;
          var k = ORG_KINDS[r.kind];
          var span = spans[kinds.indexOf(r.kind)];
          span.x.push(p[0].date, p[p.length - 1].date, null);
          span.y.push(r.name, r.name, null);
          p.forEach(function (pt) {
            dots.x.push(pt.date);
            dots.y.push(r.name);
            dots.customdata.push(r.href);
            dots.marker.color.push(k.color[theme]);
            dots.marker.symbol.push(k.symbol);
            dots.marker.size.push(Math.min(9 + 2 * (pt.items.length - 1), 15));
            dots.text.push('<b>' + r.name + '</b>' + (mixed ? '（' + k.label + '）' : '') + ' · ' + pt.date +
              '<br>' + pt.items.join('<br>') + (touch ? '<br><i>再点一次该节点进入' + k.label + '路线 →</i>' : ''));
          });
        });
        var rowH = narrow ? 44 : 28;
        // 窄屏首行公司名在横线上方，顶部多留 0.3 行，避免与时间轴刻度相撞
        var top = narrow ? -0.8 : -0.5;
        var full = s.first ? [shiftMonth(s.first, -1), shiftMonth(s.last, 1)] : null;
        // 桌面纵轴机构名约占图宽 1/4；窄屏名称在横线上方，时间轴占满整宽
        var plotW = document.getElementById('trend-chart').clientWidth * (narrow ? 1 : 0.75);
        var windowed = !!full && plotW / monthsBetween(full[0], full[1]) < GANTT_MIN_PX_PER_MONTH;
        var sliderH = 36;
        // 带滑条时绘图区不低于 72px：低于 Plotly 约 64px 的下限时它会压缩边距，滑条被挤出图底
        var plotH = Math.max((names.length - 0.5 - top) * rowH, windowed ? 72 : 0);
        if (windowed) {
          ganttRange = function (years) {
            if (!years) return full;
            var start = shiftMonth(full[1], -12 * years);
            return [start > full[0] ? start : full[0], full[1]];
          };
          rangeBar.innerHTML = GANTT_WINDOWS.map(function (w) {
            return '<button type="button" data-years="' + w.years + '">' + w.label + '</button>';
          }).join('') + '<span class="trend-range-hint">' +
            (touch ? '拖动底部滑条两端选择时间范围' : '拖动底部滑条左右平移，拖两端缩放') + '</span>';
          markRange(ganttYears);
          rangeBar.hidden = false;
        }
        var plotted = Plotly.react('trend-chart', s.rows.length ? spans.concat([dots]) : [], {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          font: { color: text, size: narrow ? 11 : 12 },
          // 滑条下方 Plotly 另留约 20–40px（小图更多），一并预留
          height: plotH + 40 + (windowed ? sliderH + 44 : 0),
          margin: { t: 30, r: 12, b: 10, l: 10 },
          xaxis: {
            type: 'date', side: 'top', gridcolor: grid, fixedrange: true,
            range: windowed ? ganttRange(ganttYears) : full || undefined,
            rangeslider: windowed
              ? { visible: true, range: full, thickness: sliderH / plotH, bordercolor: grid, borderwidth: 1, bgcolor: 'rgba(0,0,0,0)' }
              : { visible: false },
            tickformatstops: [
              { dtickrange: [null, 'M6'], value: '%Y-%m' },
              { dtickrange: ['M12', null], value: '%Y' }
            ]
          },
          // 显式反向范围：首家公司在上，且不按点的大小额外留白
          yaxis: { type: 'category', categoryarray: names, range: [names.length - 0.5, top], automargin: true,
            tickvals: names, ticktext: s.rows.map(orgLink),
            ticksuffix: ' ', showticklabels: !narrow, gridcolor: grid, fixedrange: true },
          annotations: narrow ? s.rows.map(function (r) {
            return { xref: 'paper', x: 0, y: r.name, xanchor: 'left', yanchor: 'bottom', yshift: 8,
              showarrow: false, text: orgLink(r), font: { color: muted, size: 11 } };
          }) : [],
          showlegend: false, hovermode: 'closest', hoverlabel: { align: 'left' },
          dragmode: false
        }, { responsive: true, displaylogo: false, displayModeBar: false });
        // 两类机构同图时给出图例（色块 + 点形），身份不只靠颜色
        legend.innerHTML = mixed ? kinds.map(function (k) {
          return '<li><i style="background:' + ORG_KINDS[k].color[theme] +
            (ORG_KINDS[k].symbol === 'diamond' ? ';transform:rotate(45deg) scale(.85)' : ';border-radius:50%') +
            '"></i>' + ORG_KINDS[k].label + '</li>';
        }).join('') : '';
        legend.hidden = !mixed;
        status.textContent = view.label + '：' + s.total;
        return plotted.then(function (gd) {
          gd.removeAllListeners('plotly_relayout');
          // 手动拖滑条后范围不再对应任何快捷按钮
          gd.on('plotly_relayout', function (ev) {
            if (applyingRange || !ganttRange) return;
            if (ev['xaxis.range'] || ev['xaxis.range[0]'] !== undefined) markRange(null);
          });
          bindChartLinks(gd, view, function (pt) { return pt.customdata; });
          return gd;
        });
      }

      // 点击条形 / 节点跳到对应页面（hrefOf 为空则不跳转）。react 复用同一个图表元素，
      // 先清掉旧监听；只响应绘制它的视图，切到其他视图后点击不再跳转。
      // 触屏：第一次轻点只弹出悬停提示，再点同一节点 / 条形才跳转，避免看数据时误触跳走。
      // Plotly 一次轻点会先按 touchstart、再按浏览器模拟的 mousedown 各派发一次 click，后者忽略
      function bindChartLinks(gd, view, hrefOf) {
        gd.removeAllListeners('plotly_click');
        gd.removeAllListeners('plotly_hover');
        gd.removeAllListeners('plotly_unhover');
        if (!hrefOf) return;
        var drag = function () { return gd.querySelector('.nsewdrag'); };
        var armed = null; // 已轻点一次、等待再点跳转的节点
        var lastTouch = 0;
        gd.on('plotly_click', function (ev) {
          var pt = ev.points[0];
          var href = current === view && pt && hrefOf(pt);
          if (!href) return;
          if (touch) {
            var type = ev.event && ev.event.type;
            if (type === 'touchstart') lastTouch = Date.now();
            else if (type === 'mousedown' && Date.now() - lastTouch < 1000) return;
            // 甘特图同一机构的各节点内容不同，须点同一节点；堆叠条形同一条上任意一段都算
            var same = armed && (view.kind === 'gantt'
              ? armed.curveNumber === pt.curveNumber && armed.pointNumber === pt.pointIndex
              : armed.href === href);
            if (!same) {
              armed = { curveNumber: pt.curveNumber, pointNumber: pt.pointIndex, href: href };
              Plotly.Fx.hover(gd, [armed]);
              return;
            }
            armed = null; // 返回键从往返缓存恢复本页时，不能一点就跳
          }
          window.location.href = href;
        });
        gd.on('plotly_hover', function () { if (drag()) drag().style.cursor = 'pointer'; });
        gd.on('plotly_unhover', function () {
          if (drag()) drag().style.cursor = '';
          if (!armed) return;
          // 同一次轻点里的模拟鼠标事件会立刻收起提示，补回；之后再收起（点了空白处）则取消待跳转
          if (Date.now() - lastTouch < 1000) Plotly.Fx.hover(gd, [armed]);
          else armed = null;
        });
      }

      VIEWS.forEach(function (v) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = v.label;
        b.dataset.view = v.id;
        b.addEventListener('click', function () { render(v); });
        tabs.appendChild(b);
      });
      // 主题切换后按新配色重绘；main.js 加载时会重设同值 data-theme，需跳过
      new MutationObserver(function (records) {
        var theme = document.documentElement.getAttribute('data-theme');
        if (current && records.some(function (r) { return r.oldValue !== theme; })) render(current);
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'], attributeOldValue: true });
      // 跨过窄屏断点时切换长 / 短标签（甘特图切换机构名位置）
      narrowMq.addEventListener('change', function () {
        if (current && (current.kind === 'category' || current.kind === 'gantt')) render(current);
      });
      var wanted = new URLSearchParams(location.search).get('view');
      render(VIEWS.filter(function (v) { return v.id === wanted; })[0] || VIEWS[0]);
    })();
  </script>
  <script src="wiki-type-labels.js"></script>
  <script src="main.js"></script>
</body>
</html>
