name: Auto Fold & Archive Logs

# main 上唯一会改「机器人专属」入库文件的地方：
#   - 把 log.d/ 碎片并入 log.md 顶部
#   - 将超过保留窗口的历史 log.md 条目按季度归档到 docs/plans/archive/log-YYYY-QN.md
# PR 不修改 log.md（lint.yml 的 pr_derived_guard 会拦），所以这里的提交不会与任何 PR 冲突。
# catalog.md 与统计 JSON / 徽章 / Hero 数字均已移出版本库（按需或部署时生成）。

on:
  push:
    branches: [main]
    paths:
      - 'log.d/**'
      - 'scripts/log_md.py'
      - 'scripts/fold_log_fragments.py'
  workflow_dispatch:

# 串行执行，避免与并发 main 推送互相 cancel / 抢写导致 git push 被拒
concurrency:
  group: auto-export-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 取最新 main 而非触发事件的 SHA：串行排队的后一轮能看到前一轮已并入的碎片
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fold log fragments and rotate old archives
        run: python3 scripts/fold_log_fragments.py

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A log.md log.d/ docs/plans/archive/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: fold log.d and archive old logs [skip ci]"
          # 与其他 PR 合并推送竞态时 rebase 重试；PR 不碰 log.md，rebase 不会冲突
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebase onto origin/main and retry"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
