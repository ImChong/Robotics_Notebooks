name: Daily Robotics Discovery Update

on:
  schedule:
    # 北京时间 09:00（UTC 01:00）每日自动刷新精选数据
    - cron: '0 1 * * *'
  workflow_dispatch:

concurrency:
  group: discovery-daily-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-lite.txt

      - name: Install lightweight dependencies
        run: pip install -r requirements-ci-lite.txt

      - name: Generate Robotics Discovery curated picks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_discovery_picks.py

      - name: Commit updated discovery picks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/discovery-picks.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(discovery): 自动更新 Robotics Discovery 精选 [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebase onto origin/main and retry"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
