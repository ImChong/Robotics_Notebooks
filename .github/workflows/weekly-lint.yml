name: Daily Wiki Lint Report

on:
  schedule:
    - cron: '0 2 * * *'  # 每日 UTC 02:00
  workflow_dispatch:       # 支持手动触发

concurrency:
  group: weekly-lint-main
  cancel-in-progress: false

jobs:
  lint-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-lite.txt

      - name: Install dependencies
        run: pip install -r requirements-ci-lite.txt

      # lint-report.md 不入库（避免与 PR 冲突），作为 workflow artifact 保存
      - name: Run lint and save report
        run: python3 scripts/lint_wiki.py --report

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: exports/lint-report.md

      # 顺带记录当日星标总数（增长趋势页 docs/star-history.html 的数据源）
      - name: Record star count
        run: python3 scripts/generate_star_history.py

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/exports/star-history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: 自动更新星标数 [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebase onto origin/main and retry"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
