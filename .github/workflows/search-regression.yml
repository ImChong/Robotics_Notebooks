name: Search & Export Quality Check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/search-regression.yml'
      - 'wiki/**'
      - 'scripts/**'
      - 'schema/**'
      - 'sources/**'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/search-regression.yml'
      - 'wiki/**'
      - 'scripts/**'
      - 'schema/**'
      - 'sources/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-lite.txt

      - name: Detect PR change scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/ci_change_scope.py --base "origin/${{ github.base_ref }}" --output-file "$RUNNER_TEMP/ci-scope.json" --github-output "$GITHUB_OUTPUT"
          else
            python3 scripts/ci_change_scope.py --full --output-file "$RUNNER_TEMP/ci-scope.json" --github-output "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pip install -r requirements-ci-lite.txt

      - name: Set up Node
        if: steps.scope.outputs.mode == 'full'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Run CI preflight
        if: steps.scope.outputs.mode == 'full'
        id: preflight
        run: python3 scripts/ci_preflight.py

      # Full export still smoke-tests site generation for content-only ingest PRs;
      # graph/lint/mermaid quality is checked separately in incremental jobs.
      - name: Export smoke test (ingest)
        if: steps.scope.outputs.mode == 'ingest'
        run: python3 scripts/export_minimal.py

      # 搜索回归结果随内容变化（新页面可能挤掉期望结果），只依赖上一步导出，开销小，PR 上保留。
      - name: Search regression (ingest)
        if: steps.scope.outputs.mode == 'ingest'
        id: search_ingest
        run: python3 scripts/eval_search_quality.py

      - name: Summary
        if: always()
        run: |
          echo "## CI preflight（搜索回归 / Wiki lint / 导出质量）" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "模式：**${{ steps.scope.outputs.mode }}**；preflight：**${{ steps.preflight.outcome }}**；ingest 搜索回归：**${{ steps.search_ingest.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "完整模式执行 ci_preflight；纯 ingest PR 运行导出 smoke test + 搜索回归，Wiki lint / Mermaid 交给增量门禁，导出一致性与图谱检查留给 main 全量 CI。" >> "$GITHUB_STEP_SUMMARY"
