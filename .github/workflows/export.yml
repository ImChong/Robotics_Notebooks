name: Auto Export & Lint

on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - 'sources/**'
      - 'roadmap/**'
      - 'scripts/**'
  workflow_dispatch:

# 串行执行，避免与并发 main 推送互相 cancel / 抢写导致 git push 被拒
concurrency:
  group: auto-export-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # ci_preflight → generate_link_graph 需要完整历史以计算 git 首次加入日
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-lite.txt

      - name: Install lightweight dependencies
        run: pip install -r requirements-ci-lite.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Run CI preflight
        run: python3 scripts/ci_preflight.py

      - name: Commit updated exports
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 大体积站点 JSON 与 sitemap 已改为 pages.yml 部署时生成（见 .gitignore），
          # 此处仅提交仍入库的小型派生文件（统计、徽章、目录等）
          git add exports/ docs/exports/ catalog.md README.md docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: auto-export + badge [skip ci]"
          # 与其他 PR 合并推送竞态时 rebase 重试，避免 ! [rejected] (fetch first)
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebase onto origin/main and retry"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
