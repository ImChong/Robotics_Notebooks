<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Robotics Notebooks 的 GitHub 星标、知识节点与纵深路线随时间变化的交互式趋势图，以及各社区、各纵深路线、各公司的节点数分布与公司技术路线时间线。" />
  <title>增长趋势 | Robotics Notebooks</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
  <meta name="color-scheme" content="dark light" />
  <script src="theme-init.js"></script>
  <script id="sponsor-js" src="sponsor.js?v=2"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#191919" />
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
  <script src="graph-tooltip.js"></script>
  <script src="depth-filters.js"></script>
  <style>
    /* 七个视图在窄屏换行，并与副标题拉开距离 */
    #trend-tabs { flex-wrap: wrap; }
    #trend-section .home-hub-head { margin-bottom: 10px; }
    /* 底部按钮复用 change-log 的 .updates-timeline-actions；本页无时间线左轨道，去掉内缩 */
    #trend-section .updates-timeline-actions { padding-left: 0; padding-right: 0; }
    /* 纵深 / 公司节点数的社区配色图例：按宽度自动分列 */
    .trend-legend {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px 12px;
      list-style: none; margin: 12px 0; padding: 0; font-size: .85rem; color: var(--text-muted);
    }
    .trend-legend[hidden] { display: none; }
    .trend-legend li { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .trend-legend i { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="site-title" aria-label="机器人技术栈地图首页">🗺️ Robotics Notebooks | 机器人技术栈地图</a>
      <div class="header-spacer"></div>
      <div class="header-right">
        <a href="https://github.com/ImChong/Robotics_Notebooks" class="github-link" target="_blank" rel="noopener noreferrer">GitHub</a>
        <button id="themeToggle" class="theme-toggle" aria-label="切换白天黑夜模式" title="切换白天黑夜模式">
          <span class="icon-sun">☀️</span>
          <span class="icon-moon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="section" id="trend-section" aria-labelledby="trend-heading">
      <div class="container">
        <div class="home-hub-head">
          <h1 class="section-title" id="trend-heading">增长趋势</h1>
          <div class="home-hub-tabs" id="trend-tabs" role="group" aria-label="切换趋势视图"></div>
        </div>
        <p class="section-subtitle">星标数每日定时记录；节点与纵深路线按 git 首次加入日统计（仅含现存页面）；社区与纵深节点数取自当前知识图谱，公司节点数按公司技术路线收录统计；公司时间线按各节点注明的月份绘制。</p>
        <p class="data-meta" id="trend-status" aria-live="polite">加载中…</p>
        <ul class="trend-legend" id="trend-legend" aria-label="社区配色" hidden></ul>
        <div id="trend-chart" style="width:100%;min-height:460px"></div>
        <div class="updates-timeline-actions" role="group" aria-label="增长趋势导航">
          <div class="updates-timeline-actions-start">
            <a class="btn-secondary" href="change-log.html">查看更新记录</a>
            <a class="btn-secondary" href="https://github.com/ImChong/Robotics_Notebooks" target="_blank" rel="noopener noreferrer">⭐ 去 GitHub 点个 Star</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© <a href="https://imchong.github.io/index.html" target="_blank" rel="noopener noreferrer">Chong Liu</a> 2026 · Robotics Notebooks</p>
    </div>
  </footer>

  <script>
    (function () {
      var tabs = document.getElementById('trend-tabs');
      var status = document.getElementById('trend-status');
      var legend = document.getElementById('trend-legend');

      function getJSON(url) {
        return fetch(url).then(function (r) {
          if (!r.ok) throw new Error(r.status + ' ' + url);
          return r.json();
        });
      }

      // 按日计数 → 累计序列
      function cumulative(daily) {
        var total = 0;
        return { x: daily.x, y: daily.y.map(function (n) { return (total += n); }) };
      }
      function dailyFromDates(dates) {
        var byDay = {};
        dates.forEach(function (d) { byDay[d] = (byDay[d] || 0) + 1; });
        var x = Object.keys(byDay).sort();
        return { x: x, y: x.map(function (d) { return byDay[d]; }) };
      }

      // 每日定时任务记录的星标总数快照 [[日期, 总数], ...]
      var starCounts = getJSON('exports/star-history.json').then(function (d) {
        return { x: d.counts.map(function (c) { return c[0]; }), y: d.counts.map(function (c) { return c[1]; }) };
      });

      var addedNodes = getJSON('exports/wiki-activity.json').then(function (a) {
        var out = [];
        a.days.forEach(function (d) {
          d.nodes.forEach(function (n) {
            if (n.action === 'added') out.push({ date: d.date, path: n.path || '' });
          });
        });
        return out;
      });

      // 社区 / 纵深 / 公司节点数：取当前知识图谱快照（仅在切到对应视图时加载）
      var linkGraphPromise = null;
      function linkGraph() {
        return linkGraphPromise || (linkGraphPromise = getJSON('exports/link-graph.json'));
      }
      var companyRoadmapsPromise = null;
      function companyRoadmaps() {
        return companyRoadmapsPromise || (companyRoadmapsPromise = getJSON('company-roadmaps.json'));
      }

      function depthDaily() {
        return addedNodes.then(function (n) {
          return dailyFromDates(n.filter(function (v) { return /^roadmap\/depth-/.test(v.path); })
            .map(function (v) { return v.date; }));
        });
      }

      var VIEWS = [
        { id: 'stars', label: '星数趋势', unit: '星标', kind: 'line',
          load: function () { return starCounts; } },
        { id: 'stars-daily', label: '每日星数', unit: '新增星标', kind: 'bar',
          load: function () {
            // 相邻快照之差；有取消星标时可能为负
            return starCounts.then(function (s) {
              return { x: s.x, y: s.y.map(function (n, i) { return n - (i ? s.y[i - 1] : 0); }) };
            });
          } },
        { id: 'nodes', label: '节点数趋势', unit: '节点', kind: 'line',
          load: function () { return addedNodes.then(function (n) { return cumulative(dailyFromDates(n.map(function (v) { return v.date; }))); }); } },
        { id: 'nodes-daily', label: '每日节点数', unit: '新增节点', kind: 'bar',
          load: function () { return addedNodes.then(function (n) { return dailyFromDates(n.map(function (v) { return v.date; })); }); } },
        { id: 'depth', label: '纵深数趋势', unit: '纵深路线', kind: 'line', hidden: true,
          load: function () { return depthDaily().then(cumulative); } },
        { id: 'depth-daily', label: '每日纵深数', unit: '新增纵深路线', kind: 'bar', hidden: true,
          load: depthDaily },
        { id: 'communities', label: '社区节点数', unit: '节点', kind: 'category',
          load: function () {
            return linkGraph().then(function (g) {
              var list = RNGraphTooltip.getSortedCommunities(g.communities)
                .filter(function (c) { return c.size > 0; });
              var color = RNGraphTooltip.buildCommunityColorMap(g.communities);
              return {
                // 与纵深节点数一致：显示「中文（English）」，仅去掉末尾「社区」
                cats: list.map(function (c) { return String(c.label || c.id).replace(/\s*社区\s*$/, ''); }),
                series: [{
                  values: list.map(function (c) { return c.size; }),
                  color: list.map(function (c) { return color[c.id]; })
                }],
                total: list.length + ' 个社区，合计 ' + list.reduce(function (a, c) { return a + c.size; }, 0) + ' 节点'
              };
            });
          } },
        { id: 'depth-nodes', label: '纵深节点数', unit: '节点', kind: 'category',
          load: function () {
            // 纵深命中口径与 graph.html 路线视图一致；条形按节点主社区堆叠着色
            return linkGraph().then(function (g) {
              var D = RNDepthFilters;
              var count = {};
              g.nodes.forEach(function (n) {
                D.depthsForNode(n).forEach(function (k) {
                  var byDepth = count[n.community] || (count[n.community] = {});
                  byDepth[k] = (byDepth[k] || 0) + 1;
                });
              });
              var color = RNGraphTooltip.buildCommunityColorMap(g.communities);
              var sum = 0;
              var series = RNGraphTooltip.getSortedCommunities(g.communities)
                .filter(function (c) { return count[c.id]; })
                .map(function (c) {
                  var values = D.DEPTH_ORDER.map(function (k) { return count[c.id][k] || 0; });
                  values.forEach(function (v) { sum += v; });
                  return { name: RNGraphTooltip.shortenCommunityLabel(c.label), values: values, color: color[c.id] };
                });
              return {
                cats: D.DEPTH_ORDER.map(function (k) { return D.DEPTH_META[k].label; }),
                series: series,
                total: D.DEPTH_ORDER.length + ' 条纵深，合计 ' + sum + ' 节点次（一个节点可属多条纵深）'
              };
            });
          } }
      ];
      VIEWS.push({ id: 'company-nodes', label: '公司节点数', unit: '节点', kind: 'category',
        load: function () {
          return Promise.all([linkGraph(), companyRoadmaps()]).then(function (data) {
            var g = data[0];
            var companies = data[1].companies || [];
            var nodes = new Map(g.nodes.map(function (n) { return [n.detail_id, n]; }));
            var count = {};
            var sum = 0;
            // 公司顺序与首页一致；同一公司内按知识节点 ID 去重，跨公司分别计数。
            companies.forEach(function (company, i) {
              var seen = new Set();
              (company.nodes || []).forEach(function (entry) {
                var n = nodes.get(entry.id);
                if (!n || seen.has(n.id)) return;
                seen.add(n.id);
                var values = count[n.community] || (count[n.community] = companies.map(function () { return 0; }));
                values[i] += 1;
                sum += 1;
              });
            });
            var color = RNGraphTooltip.buildCommunityColorMap(g.communities);
            return {
              cats: companies.map(function (company) { return company.name; }),
              series: RNGraphTooltip.getSortedCommunities(g.communities)
                .filter(function (c) { return count[c.id]; })
                .map(function (c) {
                  return { name: RNGraphTooltip.shortenCommunityLabel(c.label), values: count[c.id], color: color[c.id] };
                }),
              total: companies.length + ' 家公司，合计 ' + sum + ' 节点次（公司内去重，一个节点可属多家公司）'
            };
          });
        } });
      // 公司路线甘特图：每家公司一行（顺序同首页），同月节点合并为一个点；未注明日期的节点不绘制
      VIEWS.push({ id: 'company-timeline', label: '公司时间线', unit: '节点', kind: 'gantt',
        load: function () {
          return companyRoadmaps().then(function (data) {
            var dated = 0;
            var undated = 0;
            var rows = (data.companies || []).map(function (company) {
              var byDate = {};
              (company.nodes || []).forEach(function (n) {
                if (!n.date) { undated += 1; return; }
                dated += 1;
                (byDate[n.date] || (byDate[n.date] = [])).push(n.title + '（' + n.track + '）');
              });
              return {
                name: company.name,
                points: Object.keys(byDate).sort().map(function (d) { return { date: d, items: byDate[d] }; })
              };
            }).filter(function (r) { return r.points.length; });
            var dates = rows.map(function (r) { return r.points[0].date; })
              .concat(rows.map(function (r) { return r.points[r.points.length - 1].date; })).sort();
            return {
              rows: rows,
              first: dates[0],
              last: dates[dates.length - 1],
              total: rows.length + ' 家公司，' + dated + ' 个已注明日期的节点'
                + (dates.length ? '（' + dates[0] + ' → ' + dates[dates.length - 1] + '）' : '')
                + (undated ? '；另有 ' + undated + ' 个未注明日期的节点未绘制' : '')
            };
          });
        } });
      // 暂时隐藏的视图（纵深数趋势 / 每日纵深数）
      VIEWS = VIEWS.filter(function (v) { return !v.hidden; });

      var touch = window.matchMedia('(pointer: coarse)').matches;
      var narrowMq = window.matchMedia('(max-width: 640px)');
      var current = null;
      // Plotly 调用串行化：上一次 react 未完成时再 react 会留下错乱的内部状态
      //（范围滑条被撑到 2000-01-01），拖动滑条后坐标轴随之跑偏
      var drawing = Promise.resolve();
      function render(view) {
        current = view;
        Array.prototype.forEach.call(tabs.children, function (b) {
          var active = b.dataset.view === view.id;
          b.className = 'home-hub-tab' + (active ? ' is-active' : '');
          b.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
        status.textContent = '加载中…';
        view.load().then(function (s) {
          var job = drawing.then(function () { return draw(view, s); });
          drawing = job.catch(function () {});
          return job;
        }).catch(function (e) {
          if (current !== view) return;
          status.textContent = '加载失败：' + e.message;
          if (window.Plotly) Plotly.purge('trend-chart');
        });
        history.replaceState(null, '', '?view=' + view.id);
      }

      function draw(view, s) {
        if (current !== view) return;
        var css = getComputedStyle(document.documentElement);
        var text = css.getPropertyValue('--text').trim();
        var muted = css.getPropertyValue('--text-muted').trim();
        var grid = css.getPropertyValue('--border').trim();
        var accent = css.getPropertyValue('--accent').trim();
        if (view.kind === 'category') return drawCategory(view, s, text, muted, grid);
        if (view.kind === 'gantt') return drawGantt(view, s, text, muted, grid, accent, css.getPropertyValue('--bg').trim());
        legend.hidden = true;
        var trace = view.kind === 'bar'
          ? { type: 'bar', marker: { color: accent }, width: 0.8 * 86400000 } // 日期不连续时固定为 0.8 天宽
          : { type: 'scatter', mode: 'lines', line: { color: accent, width: 2, shape: 'hv' } };
        trace.x = s.x;
        trace.y = s.y;
        trace.hovertemplate = '%{x|%Y-%m-%d}<br>%{y} ' + view.unit + '<extra></extra>';
        var plotted = Plotly.react('trend-chart', [trace], {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          // 显式高度：分类视图更高，切回时 react 不会按容器重算高度
          font: { color: text }, height: 460, margin: { t: 20, r: 20, b: 50, l: 60 },
          xaxis: {
            gridcolor: grid, type: 'date', rangeslider: { visible: true },
            // 数字日期格式，避免 Plotly 默认的英文月份（May 2026）
            tickformatstops: [
              { dtickrange: [null, 86400000 - 1], value: '%m-%d %H:%M' },
              { dtickrange: [86400000, 14 * 86400000], value: '%m-%d' },
              { dtickrange: [14 * 86400000 + 1, null], value: '%Y-%m' }
            ]
          },
          yaxis: { gridcolor: grid, title: view.unit, rangemode: 'tozero' },
          bargap: 0.2,
          modebar: { bgcolor: 'rgba(0,0,0,0)', color: muted, activecolor: text },
          // 触屏上拖拽框选会吞掉页面滚动；缩放交给下方范围滑条
          dragmode: touch ? false : 'zoom'
        }, { responsive: true, displaylogo: false, displayModeBar: !touch });
        var total = view.kind === 'bar'
          ? s.y.reduce(function (a, b) { return a + b; }, 0)
          : (s.y[s.y.length - 1] || 0);
        status.textContent = view.label + '：' + (view.kind === 'bar' ? '合计 ' : '当前 ') + total + ' ' + view.unit
          + (s.x.length ? '（' + s.x[0] + ' → ' + s.x[s.x.length - 1] + '）' : '');
        return plotted;
      }

      // 社区名 / 纵深名 / 公司名做横向条形图：长标签放纵轴水平排布，不再斜排挤占图面；
      // 保持数据给出的顺序，首项在上，条末标数值；多个 series 时按社区堆叠并显示图例
      function drawCategory(view, s, text, muted, grid) {
        var narrow = narrowMq.matches;
        var totals = s.cats.map(function (_, i) {
          return s.series.reduce(function (a, t) { return a + t.values[i]; }, 0);
        });
        // 窄屏只显示中文名，完整「中文（English）」留给悬停提示
        var labels = s.cats.map(function (c) {
          return narrow ? RNGraphTooltip.shortenCommunityLabel(c) : c;
        });
        var stacked = s.series.length > 1;
        var traces = s.series.map(function (t) {
          return {
            type: 'bar', orientation: 'h', name: t.name,
            y: labels, x: t.values, customdata: s.cats, marker: { color: t.color },
            hovertemplate: '%{customdata}<br>' + (t.name ? t.name + '：' : '') + '%{x} ' + view.unit + '<extra></extra>'
          };
        });
        // 社区配色图例用 HTML 网格：Plotly 图例在长纵轴标签旁换行不可控
        legend.innerHTML = stacked ? s.series.map(function (t) {
          return '<li><i style="background:' + t.color + '"></i>' + t.name + '</li>';
        }).join('') : '';
        legend.hidden = !stacked;
        var height = labels.length * (narrow ? 26 : 24) + 50;
        var max = Math.max.apply(null, [1].concat(totals));
        var plotted = Plotly.react('trend-chart', traces, {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          font: { color: text, size: narrow ? 11 : 12 }, height: height,
          margin: { t: 10, r: 12, b: 30, l: 10 },
          xaxis: { gridcolor: grid, rangemode: 'tozero', range: [0, max * 1.12], fixedrange: true },
          yaxis: { type: 'category', autorange: 'reversed', automargin: true, ticksuffix: ' ', fixedrange: true },
          annotations: totals.map(function (v, i) {
            return { x: v, y: labels[i], text: String(v), xanchor: 'left', xshift: 4,
              showarrow: false, font: { color: muted, size: narrow ? 10 : 11 } };
          }),
          barmode: 'stack', bargap: 0.25, showlegend: false,
          modebar: { bgcolor: 'rgba(0,0,0,0)', color: muted, activecolor: text },
          dragmode: false
        }, { responsive: true, displaylogo: false, displayModeBar: false });
        status.textContent = view.label + '：' + s.total;
        return plotted;
      }

      // 'YYYY-MM' 前后平移若干月，给时间轴两端留白
      function shiftMonth(ym, k) {
        return new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + k, 1)).toISOString().slice(0, 7);
      }

      // 公司路线甘特图：横线连起首末节点，点为当月节点（同月多个则放大，悬停列出标题与方向）。
      // 窄屏隐藏纵轴标签，把公司名放到各自横线上方，让时间轴占满整宽
      function drawGantt(view, s, text, muted, grid, accent, bg) {
        var narrow = narrowMq.matches;
        var names = s.rows.map(function (r) { return r.name; });
        var span = { type: 'scatter', mode: 'lines', x: [], y: [], hoverinfo: 'skip', opacity: 0.35,
          line: { color: accent, width: narrow ? 4 : 6 } };
        var dots = { type: 'scatter', mode: 'markers', x: [], y: [], text: [],
          marker: { color: accent, size: [], line: { color: bg, width: 1 } },
          hovertemplate: '%{text}<extra></extra>' };
        s.rows.forEach(function (r) {
          var p = r.points;
          span.x.push(p[0].date, p[p.length - 1].date, null);
          span.y.push(r.name, r.name, null);
          p.forEach(function (pt) {
            dots.x.push(pt.date);
            dots.y.push(r.name);
            dots.marker.size.push(Math.min(9 + 2 * (pt.items.length - 1), 15));
            dots.text.push('<b>' + r.name + '</b> · ' + pt.date + '<br>' + pt.items.join('<br>'));
          });
        });
        var rowH = narrow ? 44 : 28;
        // 窄屏首行公司名在横线上方，顶部多留 0.3 行，避免与时间轴刻度相撞
        var top = narrow ? -0.8 : -0.5;
        var plotted = Plotly.react('trend-chart', s.rows.length ? [span, dots] : [], {
          paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
          font: { color: text, size: narrow ? 11 : 12 }, height: (names.length - 0.5 - top) * rowH + 40,
          margin: { t: 30, r: 12, b: 10, l: 10 },
          xaxis: {
            type: 'date', side: 'top', gridcolor: grid, fixedrange: true,
            range: s.first ? [shiftMonth(s.first, -1), shiftMonth(s.last, 1)] : undefined,
            tickformatstops: [
              { dtickrange: [null, 'M6'], value: '%Y-%m' },
              { dtickrange: ['M12', null], value: '%Y' }
            ]
          },
          // 显式反向范围：首家公司在上，且不按点的大小额外留白
          yaxis: { type: 'category', categoryarray: names, range: [names.length - 0.5, top], automargin: true,
            ticksuffix: ' ', showticklabels: !narrow, gridcolor: grid, fixedrange: true },
          annotations: narrow ? names.map(function (name) {
            return { xref: 'paper', x: 0, y: name, xanchor: 'left', yanchor: 'bottom', yshift: 8,
              showarrow: false, text: name, font: { color: muted, size: 11 } };
          }) : [],
          showlegend: false, hovermode: 'closest', hoverlabel: { align: 'left' },
          dragmode: false
        }, { responsive: true, displaylogo: false, displayModeBar: false });
        legend.hidden = true;
        status.textContent = view.label + '：' + s.total;
        return plotted;
      }

      VIEWS.forEach(function (v) {
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = v.label;
        b.dataset.view = v.id;
        b.addEventListener('click', function () { render(v); });
        tabs.appendChild(b);
      });
      // 主题切换后按新配色重绘；main.js 加载时会重设同值 data-theme，需跳过
      new MutationObserver(function (records) {
        var theme = document.documentElement.getAttribute('data-theme');
        if (current && records.some(function (r) { return r.oldValue !== theme; })) render(current);
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'], attributeOldValue: true });
      // 跨过窄屏断点时切换长 / 短标签（甘特图切换公司名位置）
      narrowMq.addEventListener('change', function () {
        if (current && (current.kind === 'category' || current.kind === 'gantt')) render(current);
      });
      var wanted = new URLSearchParams(location.search).get('view');
      render(VIEWS.filter(function (v) { return v.id === wanted; })[0] || VIEWS[0]);
    })();
  </script>
  <script src="wiki-type-labels.js"></script>
  <script src="main.js"></script>
</body>
</html>
