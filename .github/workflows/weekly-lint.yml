name: Weekly Wiki Lint Report

on:
  schedule:
    - cron: '0 2 * * 1'  # 每周一 UTC 02:00
  workflow_dispatch:       # 支持手动触发

concurrency:
  group: weekly-lint-main
  cancel-in-progress: false

jobs:
  lint-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci-lite.txt

      - name: Install dependencies
        run: pip install -r requirements-ci-lite.txt

      - name: Run lint and save report
        run: |
          python3 scripts/lint_wiki.py --report
          python3 scripts/update_badge.py

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/lint-report.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: 自动更新每周 lint 报告 + sources badge [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebase onto origin/main and retry"
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries" >&2
          exit 1
